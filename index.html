<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital.in — Digitalisasi UMKM bersama Talenta Mahasiswa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>

:root {

  --bg: #F6F9FC;
  --surface: #FFFFFF;

  --border: #E1E8F0;
  --border-strong: #C9D5E3;

  --text: #17233A;
  --text-muted: #64748B;
  --text-faint: #94A3B8;

  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-darker: #173B7A;

  --primary-light: #DBEAFE;
  --primary-tint: #EFF6FF;

  --sky: #38BDF8;
  --sky-tint: #E0F2FE;

  --success: #16A34A;
  --success-bg: #DCFCE7;

  --warning: #D97706;
  --warning-bg: #FEF3C7;

  --error: #DC2626;
  --error-bg: #FEE2E2;

  --info: #0284C7;
  --info-bg: #E0F2FE;

  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;

  --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
  --shadow-md: 0 6px 20px rgba(15,23,42,.08);

}


*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
ul{margin:0;padding:0;list-style:none;}
::selection{background:var(--primary-light);}

/* ---------- Type scale ---------- */
.t-display{font-size:44px;line-height:1.14;font-weight:800;letter-spacing:-0.01em;}
.t-h1{font-size:32px;line-height:1.2;font-weight:700;letter-spacing:-0.01em;}
.t-h2{font-size:24px;line-height:1.28;font-weight:700;}
.t-h3{font-size:18px;line-height:1.35;font-weight:700;}
.t-body{font-size:15px;line-height:1.6;font-weight:400;}
.t-small{font-size:13px;line-height:1.5;font-weight:400;}
.t-caption{font-size:12px;line-height:1.4;font-weight:600;color:var(--text-faint);}
.t-button{font-size:14px;font-weight:600;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);}

@media (max-width:640px){
  .t-display{font-size:32px;}
  .t-h1{font-size:26px;}
  .t-h2{font-size:20px;}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:var(--r-sm);border:1px solid transparent;
  font-size:14px;font-weight:600;transition:background .12s ease, border-color .12s ease;
  white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border-strong);}
.btn-secondary:hover{border-color:var(--text-muted);}
.btn-ghost{background:transparent;color:var(--primary-dark);}
.btn-ghost:hover{background:var(--primary-tint);}
.btn-danger-ghost{background:transparent;color:var(--error);border:1px solid var(--error-bg);}
.btn-danger-ghost:hover{background:var(--error-bg);}
.btn-sm{padding:7px 14px;font-size:13px;}
.btn-lg{padding:13px 26px;font-size:15px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-icon{padding:9px;border-radius:var(--r-sm);}

/* ---------- Layout shells ---------- */
#app{min-height:100vh;}
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:236px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 22px;}
.sidebar-brand .mark{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
.sidebar-brand .name{font-weight:800;font-size:17px;}
.sidebar-nav a{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-sm);
  font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:2px;
}
.sidebar-nav a svg{width:18px;height:18px;flex-shrink:0;}
.sidebar-nav a:hover{background:var(--bg);color:var(--text);}
.sidebar-nav a.active{background:var(--primary-light);color:var(--primary-dark);}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);}
.sidebar-user:hover{background:var(--bg);}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.avatar-sm{width:28px;height:28px;font-size:11px;}
.avatar-lg{width:64px;height:64px;font-size:22px;}

.main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:64px;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20;
}
.topbar-title{font-weight:700;font-size:17px;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.icon-btn{width:38px;height:38px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;}
.icon-btn:hover{background:var(--bg);}
.icon-btn svg{width:18px;height:18px;color:var(--text-muted);}
.dot-badge{
  position:absolute;
  top:7px;
  right:7px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--primary);
  border:1.5px solid var(--surface);
}
.content{padding:28px;max-width:1180px;width:100%;margin:0 auto;}
.content-narrow{max-width:760px;}

.bottom-nav{display:none;}
@media (max-width:860px){
  .sidebar{display:none;}
  .content{padding:18px 16px 90px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:var(--surface);
    border-top:1px solid var(--border);z-index:30;
  }
  .bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-faint);font-size:10.5px;font-weight:600;}
  .bottom-nav a svg{width:20px;height:20px;}
  .bottom-nav a.active{color:var(--primary-dark);}
  .topbar{padding:0 16px;}
}

/* ---------- Cards / surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);}
.card-pad{padding:20px;}
.card-hover:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.grid{display:grid;gap:16px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* ---------- Badges / status ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.badge-success{background:var(--success-bg);color:var(--success);}
.badge-warning{background:var(--warning-bg);color:var(--warning);}
.badge-error{background:var(--error-bg);color:var(--error);}
.badge-info{background:var(--info-bg);color:var(--info);}
.badge-neutral{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
.badge-primary{background:var(--primary-light);color:var(--primary-dark);}
.badge-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* ---------- Progress ---------- */
.progress-track{height:7px;background:var(--bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;}
.progress-fill{height:100%;background:var(--primary);border-radius:20px;}

/* ---------- Forms ---------- */
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;}
.field .hint{font-size:12.5px;color:var(--text-faint);margin-top:6px;}
.input, select.input, textarea.input{
  width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  font-size:14.5px;background:var(--surface);color:var(--text);
}
.input:focus, select.input:focus, textarea.input:focus{outline:2px solid var(--primary);outline-offset:1px;border-color:var(--primary);}
textarea.input{resize:vertical;min-height:96px;}
.input-group{display:flex;}
.input-group .input{border-radius:var(--r-sm) 0 0 var(--r-sm);}
.input-prefix{display:flex;align-items:center;padding:0 13px;border:1px solid var(--border-strong);border-right:none;border-radius:var(--r-sm) 0 0 var(--r-sm);background:var(--bg);font-size:14px;color:var(--text-muted);}
.checkbox-row{display:flex;align-items:flex-start;gap:9px;}
.radio-card{border:1px solid var(--border-strong);border-radius:var(--r-md);padding:14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;}
.radio-card.selected{border-color:var(--primary);background:var(--primary-tint);}

/* ---------- Misc utility ---------- */
.row{display:flex;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.gap-6{gap:6px;}.gap-8{gap:8px;}.gap-10{gap:10px;}.gap-12{gap:12px;}.gap-16{gap:16px;}.gap-20{gap:20px;}
.mt-4{margin-top:4px;}.mt-8{margin-top:8px;}.mt-12{margin-top:12px;}.mt-16{margin-top:16px;}.mt-20{margin-top:20px;}.mt-24{margin-top:24px;}.mt-32{margin-top:32px;}
.mb-8{margin-bottom:8px;}.mb-12{margin-bottom:12px;}.mb-16{margin-bottom:16px;}.mb-20{margin-bottom:20px;}
.divider{height:1px;background:var(--border);margin:20px 0;}
.pill-tab{padding:8px 15px;border-radius:20px;font-size:13.5px;font-weight:600;border:1px solid var(--border-strong);color:var(--text-muted);background:var(--surface);}
.pill-tab.active{background:var(--text);color:#fff;border-color:var(--text);}
.chip{padding:5px 11px;border-radius:6px;background:var(--bg);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-muted);}
.link-btn{background:none;border:none;color:var(--primary-dark);font-weight:600;font-size:13.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}
.skeleton-photo{background:linear-gradient(135deg,var(--primary-light),var(--sky-tint));}
.clickable{cursor:pointer;}

/* ---------- Landing ---------- */
.landing-nav{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);
}
.landing-nav-inner{max-width:1180px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;justify-content:space-between;}
.landing-nav-links{display:flex;gap:30px;}
.landing-nav-links a{font-size:14.5px;font-weight:600;color:var(--text-muted);}
.landing-nav-links a:hover{color:var(--text);}
.landing-wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
@media (max-width:860px){.landing-nav-links{display:none;}}

.hero{padding:64px 0 56px;}
.hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:32px;}.hero{padding:36px 0 40px;}}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--primary-dark);background:var(--primary-light);padding:6px 12px;border-radius:20px;margin-bottom:18px;}
.hero-stats{display:flex;gap:28px;margin-top:28px;}
.hero-stat b{font-size:22px;font-weight:800;display:block;}
.hero-visual{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:6px;box-shadow:var(--shadow-md);}
.hero-visual img{border-radius:12px;width:100%;height:400px;object-fit:cover;}

.section{padding:56px 0;border-top:1px solid var(--border);}
.section-head{max-width:560px;margin-bottom:36px;}
.how-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:900px){.how-steps{grid-template-columns:repeat(2,1fr);}}
@media (max-width:560px){.how-steps{grid-template-columns:1fr;}}
.how-step{padding:22px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);}
.how-step .num{font-size:12px;font-weight:700;color:var(--primary-dark);margin-bottom:14px;}

.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:760px){.split{grid-template-columns:1fr;}}
.split-card{border-radius:var(--r-lg);padding:32px;border:1px solid var(--border);}
.split-card.umkm-c{background:var(--primary-darker);color:#fff;}
.split-card.maha-c{background:var(--surface);}
.split-card ul{margin-top:18px;}
.split-card li{display:flex;gap:10px;padding:7px 0;font-size:14.5px;}

.testi-card{padding:22px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);}
.testi-card p{font-size:14.5px;line-height:1.65;}

.cta-band{background:var(--primary);border-radius:var(--r-lg);padding:48px;text-align:center;color:#fff;}
@media (max-width:640px){.cta-band{padding:32px 20px;}}

.footer{border-top:1px solid var(--border);padding:44px 0 30px;margin-top:20px;}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:32px;}
@media (max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h4{font-size:13px;margin-bottom:12px;}
.footer-grid a{display:block;font-size:13.5px;color:var(--text-muted);padding:5px 0;}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);}
.auth-card{width:100%;max-width:420px;}
.auth-brand{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:28px;}
.progress-steps{display:flex;gap:6px;margin-bottom:28px;}
.progress-steps span{flex:1;height:4px;border-radius:4px;background:var(--border);}
.progress-steps span.done{background:var(--primary);}

/* ---------- Wizard (post project) ---------- */
.wizard-head{display:flex;gap:0;margin-bottom:32px;}
.wizard-step{flex:1;text-align:center;position:relative;font-size:12.5px;font-weight:600;color:var(--text-faint);}
.wizard-step .circ{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:12px;font-weight:700;color:var(--text-faint);}
.wizard-step.active .circ{border-color:var(--primary);color:var(--primary);background:var(--primary-tint);}
.wizard-step.done .circ{border-color:var(--primary);background:var(--primary);color:#fff;}
.wizard-step:not(:last-child)::after{content:'';position:absolute;top:14px;left:60%;width:80%;height:2px;background:var(--border);z-index:-1;}
.wizard-step.done:not(:last-child)::after{background:var(--primary);}

.template-card{border:1px solid var(--border-strong);border-radius:var(--r-md);padding:16px;cursor:pointer;}
.template-card:hover{border-color:var(--primary);}
.template-card .ic{width:38px;height:38px;border-radius:8px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}

/* ---------- Talent / project cards ---------- */
.talent-card{padding:18px;}
.talent-card .head{display:flex;gap:12px;}
.talent-card .skills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.rating{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13.5px;}
.rating svg{width:14px;height:14px;color:#D9A441;}

.project-card{padding:18px;}
.milestone-item{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--border);}
.milestone-item:last-child{border-bottom:none;}
.m-dot{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--border-strong);background:var(--surface);}
.m-dot.done{background:var(--primary);border-color:var(--primary);color:#fff;}
.m-dot.active{border-color:var(--primary);color:var(--primary);background:var(--primary-tint);}
.m-line{width:2px;flex:1;background:var(--border);margin:4px auto;}

table.simple-table{width:100%;border-collapse:collapse;}
table.simple-table th{text-align:left;font-size:12px;text-transform:none;color:var(--text-faint);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);}
table.simple-table td{padding:13px 12px;border-bottom:1px solid var(--border);font-size:14px;}
table.simple-table tr:last-child td{border-bottom:none;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.tab-btn{padding:11px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;}
.tab-btn.active{color:var(--text);border-bottom-color:var(--primary);}

.empty-state{text-align:center;padding:48px 20px;color:var(--text-muted);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:13px 22px;border-radius:var(--r-sm);font-size:14px;font-weight:600;z-index:100;box-shadow:var(--shadow-md);}
@media (max-width:860px){.toast{bottom:80px;}}
</style>
</head>

function toast(msg){

}

  return `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><div class="mark">D</div><div class="name">Digital.in</div></div>
      <nav class="sidebar-nav">
        ${nav.map(n=>`<a href="#" class="${isActive(n.id)?'active':''}" onclick="go('${n.id}');return false;">${icon(n.icon)} ${n.label}</a>`).join('')}
      </nav>
      <div class="sidebar-footer">
        <a href="#" class="sidebar-user" onclick="go('landing');state.role=null;return false;">

        </div>
      </div>
      <div class="content">${innerHtml}</div>
    </div>
  </div>
  <nav class="bottom-nav">
    ${bottom.map(id=>{const n=[...NAV_UMKM,...NAV_MAHA].find(x=>x.id===id);return `<a href="#" class="${isActive(id)?'active':''}" onclick="go('${id}');return false;">${icon(n.icon)}<span>${n.label}</span></a>`;}).join('')}
  </nav>`;
}

function render(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.screen){
    case 'landing': html = screenLanding(); break;
    case 'login': html = screenLogin(); break;
    case 'choose-type': html = screenChooseType(); break;
    case 'register': html = screenRegister(); break;
    case 'verify': html = screenVerify(); break;
    case 'forgot': html = screenForgot(); break;

    case 'umkm-dashboard': html = screenUmkmDashboard(); break;
    case 'umkm-projects': html = screenUmkmProjects(); break;
    case 'post-project': html = screenPostProject(); break;
    case 'find-talent': html = screenFindTalent(); break;
    case 'talent-profile': html = screenTalentProfile(); break;
    case 'umkm-payments': html = screenUmkmPayments(); break;

    case 'maha-dashboard': html = screenMahaDashboard(); break;
    case 'find-projects': html = screenFindProjects(); break;
    case 'project-detail': html = screenProjectDetail(); break;
    case 'apply-project': html = screenApplyProject(); break;
    case 'maha-projects': html = screenMahaProjects(); break;
    case 'portfolio': html = screenPortfolio(); break;
    case 'earnings': html = screenEarnings(); break;

    case 'my-project': html = screenMyProject(); break;
    case 'milestone-detail': html = screenMilestoneDetail(); break;
    case 'revision': html = screenRevision(); break;
    case 'messages': html = screenMessages(); break;
    case 'notifications': html = screenNotifications(); break;
    case 'profile': html = screenProfile(); break;

    default: html = screenLanding();
  }
  app.innerHTML = html;
  window.scrollTo({top:0});
}

function milestoneTimelineItem(num,title,status,date,amount,state_){
  const dotClass = state_==='done'?'done':state_==='active'?'active':'';
  const dotContent = state_==='done'?icon('check'):num;
  const badge = state_==='done'?'badge-success':state_==='active'?'badge-warning':'badge-neutral';
  return `
  <div class="milestone-item clickable" onclick="go('milestone-detail')">
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div class="m-dot ${dotClass}">${dotContent}</div>
    </div>
    <div style="flex:1;">
      <div class="row-between"><span class="t-small" style="font-weight:700;">Milestone ${num}: ${title}</span><span class="badge ${badge}">${status}</span></div>
      <div class="t-caption mt-6">Tenggat ${date} · ${amount}</div>
    </div>
  </div>`;
}
